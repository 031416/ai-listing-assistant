<div class="view bg-white p-6 rounded-2xl shadow-lg">
  <div class="flex justify-between items-start mb-6">
    <div>
      <h2 class="text-2xl font-bold text-gray-900">Automotive Auction Listing</h2>
      <p class="text-gray-500">Upload photos for AI analysis or enter details manually.</p>
    </div>
    <button (click)="backToHome()" class="text-gray-500 hover:text-gray-800">&larr; Back to Drafts</button>
  </div>
  <form #form="ngForm" (ngSubmit)="generatePdf()" class="space-y-6">
    
    <!-- Photos Section -->
    <div class="p-4 border rounded-lg bg-gray-50 space-y-4">
      <h3 class="font-semibold text-lg">📷 Photos</h3>
      <div>
        <label for="multi-photo-upload" class="w-full text-center cursor-pointer bg-gray-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-gray-700 transition block">
          Select Vehicle Photos ({{ selectedFiles.length }} selected)
        </label>
        <input type="file" id="multi-photo-upload" class="hidden" accept="image/*" multiple (change)="onFileSelected($event)">
      </div>
      <button type="button" (click)="analyzePhotos()" [disabled]="isAnalyzingPhotos() || selectedFiles.length === 0" class="w-full bg-indigo-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-indigo-700 transition disabled:bg-gray-400 disabled:cursor-not-allowed flex items-center justify-center gap-2">
        @if (isAnalyzingPhotos()) {
          <span class="loader-small"></span> Analyzing...
        } @else {
          🤖 AI Auto-Fill From Photos
        }
      </button>
      <div class="grid grid-cols-3 md:grid-cols-5 gap-4 pt-2">
        @for (slot of photoSlots; track slot) {
          <div class="photo-slot">
            @if (photoPreviews()[slot]) {
              <img [src]="'data:image/jpeg;base64,' + photoPreviews()[slot]" [alt]="slot" />
            } @else {
              <span class="photo-slot-label">{{ slot.replace('Photo', '') }}</span>
            }
          </div>
        }
      </div>
    </div>

    <!-- Vehicle Details Section -->
    <div class="p-4 border rounded-lg">
      <h3 class="font-semibold text-lg mb-4">📝 Vehicle Details</h3>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="md:col-span-2 flex items-center gap-2">
            <input type="text" [ngModel]="listing().VIN" (ngModelChange)="updateField('VIN', $event)" name="VIN" placeholder="VIN" class="p-2 border rounded w-full uppercase">
            <button type="button" (click)="decodeVin()" [disabled]="isDecodingVin() || !listing().VIN" class="p-2 bg-indigo-100 text-indigo-700 rounded-full hover:bg-indigo-200 transition disabled:opacity-50 disabled:cursor-not-allowed">
              @if (isDecodingVin()) {
                <span class="loader-small"></span>
              } @else {
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M2.5 4A1.5 1.5 0 014 2.5h12A1.5 1.5 0 0117.5 4v1a.5.5 0 01-1 0V4a.5.5 0 00-.5-.5H4a.5.5 0 00-.5.5v12a.5.5 0 00.5.5h12a.5.5 0 00.5-.5v-1a.5.5 0 011 0v1a1.5 1.5 0 01-1.5 1.5H4A1.5 1.5 0 012.5 16V4z" clip-rule="evenodd" /><path fill-rule="evenodd" d="M6 8a.5.5 0 01.5-.5h8a.5.5 0 01.5.5v1a.5.5 0 01-.5.5h-8A.5.5 0 016 9V8zm1 3.5a.5.5 0 000 1h6a.5.5 0 000-1h-6z" clip-rule="evenodd" /></svg>
              }
            </button>
        </div>
        <input type="number" [ngModel]="listing().Year" (ngModelChange)="updateField('Year', $event)" name="Year" placeholder="Year" class="p-2 border rounded">
        <input type="text" [ngModel]="listing().Make" (ngModelChange)="updateField('Make', $event)" name="Make" placeholder="Make" class="p-2 border rounded">
        <input type="text" [ngModel]="listing().Model" (ngModelChange)="updateField('Model', $event)" name="Model" placeholder="Model" class="p-2 border rounded">
        <input type="text" [ngModel]="listing().Trim" (ngModelChange)="updateField('Trim', $event)" name="Trim" placeholder="Trim" class="p-2 border rounded">
        <input type="number" [ngModel]="listing().Mileage" (ngModelChange)="updateField('Mileage', $event)" name="Mileage" placeholder="Mileage" class="p-2 border rounded">
        <input type="text" [ngModel]="listing().ColorExterior" (ngModelChange)="updateField('ColorExterior', $event)" name="ColorExterior" placeholder="Exterior Color" class="p-2 border rounded">
        <input type="text" [ngModel]="listing().ColorInterior" (ngModelChange)="updateField('ColorInterior', $event)" name="ColorInterior" placeholder="Interior Color" class="p-2 border rounded">
        <input type="text" [ngModel]="listing().Transmission" (ngModelChange)="updateField('Transmission', $event)" name="Transmission" placeholder="Transmission" class="p-2 border rounded">
        <input type="text" [ngModel]="listing().Engine" (ngModelChange)="updateField('Engine', $event)" name="Engine" placeholder="Engine" class="p-2 border rounded">
        <input type="text" [ngModel]="listing().FuelType" (ngModelChange)="updateField('FuelType', $event)" name="FuelType" placeholder="Fuel Type" class="p-2 border rounded">
        <input type="text" [ngModel]="listing().BodyType" (ngModelChange)="updateField('BodyType', $event)" name="BodyType" placeholder="Body Type" class="p-2 border rounded md:col-span-2">
        <input type="text" [ngModel]="listing().Drivetrain" (ngModelChange)="updateField('Drivetrain', $event)" name="Drivetrain" placeholder="Drivetrain" class="p-2 border rounded">
      </div>
    </div>

     <!-- Auction Details -->
     <div class="p-4 border rounded-lg grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="text" [ngModel]="listing().AuctionID" (ngModelChange)="updateField('AuctionID', $event)" name="AuctionID" placeholder="Auction ID / Stock #" class="p-2 border rounded">
        <input type="date" [ngModel]="listing().AuctionDate" (ngModelChange)="updateField('AuctionDate', $event)" name="AuctionDate" class="p-2 border rounded text-gray-500">
     </div>

    <!-- Notes Section -->
    <div class="p-4 border rounded-lg">
      <h3 class="font-semibold text-lg mb-2">🗒️ Notes for AI Enhancement</h3>
      <textarea [ngModel]="listing().ConditionNotes" (ngModelChange)="updateField('ConditionNotes', $event)" name="ConditionNotes" placeholder="Raw condition notes (e.g., small dent on driver door, tires at 50%)..." class="w-full p-2 border rounded h-24"></textarea>
      <textarea [ngModel]="listing().SpecialFeatures" (ngModelChange)="updateField('SpecialFeatures', $event)" name="SpecialFeatures" placeholder="Special features (e.g., aftermarket exhaust, new sound system)..." class="w-full p-2 border rounded h-24 mt-2"></textarea>
    </div>

    <!-- Actions -->
    <div class="flex justify-end gap-4 pt-4">
      <button type="button" (click)="saveDraft()" [disabled]="isLoading()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-6 rounded-lg transition disabled:opacity-50">
        @if(isLoading()){ <span class="loader-small"></span> Saving... } @else { Save Draft }
      </button>
      <button type="submit" [disabled]="isLoading()" class="bg-gradient-to-r from-green-600 to-teal-600 hover:from-green-700 hover:to-teal-700 text-white font-bold py-2 px-6 rounded-lg shadow-lg disabled:opacity-50">
        Generate PDF
      </button>
    </div>
  </form>
</div>
