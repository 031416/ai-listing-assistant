
<div class="view text-center">
  @if (isLoading()) {
    <div class="flex flex-col items-center justify-center p-10 bg-white rounded-2xl shadow-lg">
      <div class="loader"></div>
      <p class="mt-4 text-lg font-semibold text-gray-700">AI is crafting your listing...</p>
      <p class="text-gray-500">This may take a moment.</p>
    </div>
  } @else {
    @if (generatedData(); as data) {
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl font-bold">AI Generated Listing</h2>
        <button (click)="editInputs()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-lg">&larr; Edit Inputs</button>
      </div>
      <div class="bg-white p-6 rounded-2xl shadow-lg space-y-6">
        <div>
          <h3 class="font-bold text-xl mb-2 text-left">{{ data.title }}</h3>
          <div class="w-full border rounded-lg overflow-hidden">
            <div class="bg-gray-100 p-2 font-mono text-sm text-left border-b">Preview: Description</div>
            <iframe [srcdoc]="htmlPreview()" class="w-full h-96 border-0"></iframe>
          </div>
        </div>
        <div class="w-full border rounded-lg">
          <div class="bg-gray-100 p-2 font-mono text-sm text-left border-b flex justify-between items-center">
            <span>Export Formats</span>
            <div class="flex items-center gap-1 bg-gray-200 rounded-full p-1">
              <button (click)="selectPlatform('ebay')" [class.active]="currentPlatform() === 'ebay'" class="export-btn text-xs px-3 py-1 rounded-full transition">eBay</button>
              <button (click)="selectPlatform('poshmark')" [class.active]="currentPlatform() === 'poshmark'" class="export-btn text-xs px-3 py-1 rounded-full transition">Poshmark</button>
              <button (click)="selectPlatform('whatnot')" [class.active]="currentPlatform() === 'whatnot'" class="export-btn text-xs px-3 py-1 rounded-full transition">Whatnot</button>
              <button (click)="selectPlatform('ksl')" [class.active]="currentPlatform() === 'ksl'" class="export-btn text-xs px-3 py-1 rounded-full transition">KSL</button>
            </div>
          </div>
          <div class="p-3 bg-gray-50">
            <pre><code class="text-xs break-all text-left whitespace-pre-wrap">{{ exportOutput() }}</code></pre>
          </div>
        </div>
        <div class="mt-2 flex justify-end">
          <button (click)="exportFile()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg transition-transform transform hover:scale-105">
            Export File
          </button>
        </div>
      </div>
    } @else {
      <p class="text-red-500">Generation failed. Please try again.</p>
    }
  }
</div>
