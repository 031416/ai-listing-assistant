
<div class="max-w-4xl mx-auto p-4 md:p-6">
  <header class="mb-6 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <svg class="w-8 h-8 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 18v-5.25m0 0a6.01 6.01 0 001.5-.189m-1.5.189a6.01 6.01 0 01-1.5-.189m3.75 7.478a12.06 12.06 0 01-4.5 0m3.75 2.311a15.045 15.045 0 01-7.5 0C4.508 19.663 2.25 15.184 2.25 10.5 2.25 5.816 4.508 1.337 9 1.337c4.492 0 6.75 4.479 6.75 9.163 0 4.684-2.25 9.163-6.75 9.163z" />
      </svg>
      <h1 class="text-2xl md:text-3xl font-bold text-gray-900">AI Listing Assistant</h1>
    </div>
    @if (pwaService.installPromptVisible()) {
      <button (click)="installPwa()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg shadow transition">Install App</button>
    }
  </header>

  <main>
    @switch (appState.view()) {
      @case ('home') {
        <app-home (newListing)="showTypeSelectionModal()" />
      }
      @case ('ecommerce-editor') {
        <app-ecommerce-editor />
      }
      @case ('automotive-editor') {
        <app-automotive-editor />
      }
      @case ('generation-result') {
        <app-generation-result />
      }
      @case ('pdf-result') {
        <app-pdf-result />
      }
    }
  </main>
</div>

<!-- Modal for Listing Type Selection -->
@if (isTypeSelectionModalVisible) {
  <div class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
    <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
      <div class="mt-3 text-center">
        <h3 class="text-lg leading-6 font-medium text-gray-900">Select Listing Type</h3>
        <div class="mt-2 px-7 py-3 space-y-3">
          <button (click)="selectListingType('ecommerce')" class="w-full bg-blue-500 text-white p-3 rounded-lg hover:bg-blue-600">E-commerce Product</button>
          <button (click)="selectListingType('automotive')" class="w-full bg-green-500 text-white p-3 rounded-lg hover:bg-green-600">Automotive Auction</button>
        </div>
        <div class="items-center px-4 py-3">
          <button (click)="cancelTypeSelection()" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md w-full hover:bg-gray-300">Cancel</button>
        </div>
      </div>
    </div>
  </div>
}
